[variables]
  PYTHONUNBUFFERED = "1"

[providers]
  nixpkgs = ["python3", "tesseract", "tesseract-lang", "gcc"]

[phases.setup]
  # This runs before install
  nixPkgs = ["python3", "tesseract", "tesseract-lang"]

[phases.install]
  cmds = [
    "python -m venv /opt/venv",
    ". /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt"
  ]

[start]
  # Use the shared startup script so PORT is expanded at runtime.
  cmd = "./start.sh"
